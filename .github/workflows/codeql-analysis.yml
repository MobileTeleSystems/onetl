name: Code analysis

on:
  push:
    branches:
      - develop
  pull_request:
    branches-ignore:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: '3.13'

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: 'true'
          enable-cache: 'false'

      # astral-sh/setup-uv cannot restore multiple keys
      - name: Cache uv
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-python${{ env.DEFAULT_PYTHON }}-pydantic2-spark3.5-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-python${{ env.DEFAULT_PYTHON }}-pydantic2-spark3.5-${{ hashFiles('uv.lock') }}
            ${{ runner.os }}-python${{ env.DEFAULT_PYTHON }}-pydantic2-spark3.5-
            ${{ runner.os }}-python${{ env.DEFAULT_PYTHON }}-pydantic2-
            ${{ runner.os }}-python${{ env.DEFAULT_PYTHON }}-

      - name: Install dependencies
        run: |
          uv sync --extra files --group test-spark-3.5 --group dev

      - name: Run linters
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run -m mypy onetl

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

    # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: /language:python

min: &min
  etl-entities-version: 2
  python-version: '3.10'
  os: ubuntu-latest

max: &max
  etl-entities-version: 3
  python-version: '3.14'
  os: ubuntu-latest

matrix:
  small:
    # chonjay21/ftps image has only latest tag
    - ftp-version: latest
      <<: *max
  full:
    - ftp-version: latest
      <<: *min
    - ftp-version: latest
      <<: *max

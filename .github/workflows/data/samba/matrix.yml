min: &min
  # elswork/samba image versions does not correlate with smbd version, it is always 4.x
  server-version: latest
  etl-entities-version: 2
  python-version: '3.10'
  os: ubuntu-latest

max: &max
  server-version: latest
  etl-entities-version: 3
  python-version: '3.13'
  os: ubuntu-latest

matrix:
  small: [*max]
  full: [*min, *max]

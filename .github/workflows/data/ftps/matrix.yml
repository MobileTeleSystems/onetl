min: &min
  pydantic-version: 1
  etl-entities-version: 2
  python-version: '3.10'
  os: ubuntu-22.04

max: &max
  pydantic-version: 2
  etl-entities-version: 3
  # pydantic v1 fails with `TypeError: cannot pickle 'cell' object` on FTPS, but not on FTP`
  python-version: '3.13'
  os: ubuntu-latest

matrix:
  small:
    # chonjay21/ftps image has only latest tag
    - ftps-version: latest
      <<: *max
  full:
    - ftps-version: latest
      <<: *min
    - ftps-version: latest
      <<: *max
